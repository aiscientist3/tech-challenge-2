# Catálogo de dados — entidade: pib_municipio
# Camada Bronze | PIB municipal (IBGE)

version: "1.0"
status: completo

entity:
  id: pib_municipio
  nome: PIB — Município
  nome_tecnico: pib_municipio
  descricao: >
    Produto Interno Bruto municipal. Usado na Gold com join as-of e derivação
    de pib_per_capita (PIB / população do mesmo recorte as-of).
  dominio_negocio: Metas INEP
  tipo: indicador
  granularidade: "1 linha por ano e município"
  periodicidade: anual
  contem_dado_pessoal: false
  classificacao: Publica

governanca:
  data_owner:
    nome: AI Scientist
    email: aiscientist3@gmail.com
  data_stewards:
    - Samuel Porto
    - Walter Ferreira
    - Amanda Rarymi

origem:
  provedor: Base dos Dados
  sistema: Google BigQuery
  dataset: br_ibge_pib
  tabela: municipio
  tabela_completa: basedosdados.br_ibge_pib.municipio
  documentacao:
    - https://basedosdados.org/dataset/br-ibge-pib

destino:
  camada: bronze
  formato: delta_lake
  particionamento:
    coluna: ano
    tipo: hive_style
  caminho_relativo: bronze/br_inep_alfabetizacao/pib_municipio/

ingestao:
  pipeline: ingestion/batch/main.py
  source_code: ingestion/batch/sources/pib_municipio.py
  filtro_ano: true
  year_lookback: 10
  modo_escrita: overwrite
  colunas_origem: ano, id_municipio, pib

chaves:
  candidata_negocio:
    - ano
    - id_municipio
  estrangeiras_sugeridas:
    - coluna: id_municipio
      referencia: municipio.id_municipio
      descricao: Vínculo territorial do município

colunas:
  - nome: ano
    tipo: INTEGER
    nullable: true
    descricao: Ano de referência do PIB
    chave: true
    pii: false
  - nome: id_municipio
    tipo: STRING
    nullable: true
    descricao: ID município IBGE 7 dígitos
    chave: true
    pii: false
  - nome: pib
    tipo: FLOAT
    nullable: true
    descricao: PIB municipal a preços correntes
    chave: false
    pii: false
    indicador_negocio: true

qualidade:
  regras:
    - id: pib_ano_obrigatorio
      tipo: completude
      coluna: ano
      descricao: Coluna ano não deve ser nula
    - id: pib_id_municipio_formato
      tipo: dominio
      coluna: id_municipio
      descricao: ID município com 7 dígitos numéricos
    - id: pib_fk
      tipo: referencial
      coluna: id_municipio
      referencia: municipio.id_municipio
      descricao: id_municipio deve existir na tabela municipio
  status_implementacao: implementado

lineage:
  upstream:
    - basedosdados.br_ibge_pib.municipio
  downstream:
    - silver.pib_municipio
    - gold.contexto_territorio
    - gold.alunos_features

contrato_dados:
  frequencia_carga: conforme agendamento Databricks Job
  sla_freshness: a_definir
