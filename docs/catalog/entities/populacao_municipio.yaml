# Catálogo de dados — entidade: populacao_municipio
# Camada Bronze | Estimativas populacionais municipais (IBGE)

version: "1.0"
status: completo

entity:
  id: populacao_municipio
  nome: População — Município
  nome_tecnico: populacao_municipio
  descricao: >
    Estimativas de população residente por município e ano. Usada na Gold
    com join as-of (último ano disponível menor ou igual ao ano do aluno).
  dominio_negocio: Metas INEP
  tipo: indicador
  granularidade: "1 linha por ano e município"
  periodicidade: anual
  contem_dado_pessoal: false
  classificacao: Publica

governanca:
  data_owner:
    nome: AI Scientist
    email: aiscientist3@gmail.com
  data_stewards:
    - Samuel Porto
    - Walter Ferreira
    - Amanda Rarymi

origem:
  provedor: Base dos Dados
  sistema: Google BigQuery
  dataset: br_ibge_populacao
  tabela: municipio
  tabela_completa: basedosdados.br_ibge_populacao.municipio
  documentacao:
    - https://basedosdados.org/dataset/br-ibge-populacao

destino:
  camada: bronze
  formato: delta_lake
  particionamento:
    coluna: ano
    tipo: hive_style
  caminho_relativo: bronze/br_inep_alfabetizacao/populacao_municipio/

ingestao:
  pipeline: ingestion/batch/main.py
  source_code: ingestion/batch/sources/populacao_municipio.py
  filtro_ano: true
  year_lookback: 10
  modo_escrita: overwrite
  colunas_origem: ano, id_municipio, populacao

chaves:
  candidata_negocio:
    - ano
    - id_municipio
  estrangeiras_sugeridas:
    - coluna: id_municipio
      referencia: municipio.id_municipio
      descricao: Vínculo territorial do município

colunas:
  - nome: ano
    tipo: INTEGER
    nullable: true
    descricao: Ano da estimativa
    chave: true
    pii: false
  - nome: id_municipio
    tipo: STRING
    nullable: true
    descricao: ID município IBGE 7 dígitos
    chave: true
    pii: false
  - nome: populacao
    tipo: INTEGER
    nullable: true
    descricao: População residente estimada
    chave: false
    pii: false
    indicador_negocio: true

qualidade:
  regras:
    - id: populacao_ano_obrigatorio
      tipo: completude
      coluna: ano
      descricao: Coluna ano não deve ser nula
    - id: populacao_id_municipio_formato
      tipo: dominio
      coluna: id_municipio
      descricao: ID município com 7 dígitos numéricos
    - id: populacao_fk
      tipo: referencial
      coluna: id_municipio
      referencia: municipio.id_municipio
      descricao: id_municipio deve existir na tabela municipio
  status_implementacao: implementado

lineage:
  upstream:
    - basedosdados.br_ibge_populacao.municipio
  downstream:
    - silver.populacao_municipio
    - gold.contexto_territorio
    - gold.alunos_features

contrato_dados:
  frequencia_carga: conforme agendamento Databricks Job
  sla_freshness: a_definir
